name: Update Conflict Map
# Workflow trigger test - 2026-01-11 11:40

on:
  schedule:
    # Every 5 minutes for price updates (GitHub Actions minimum interval)
    # Runs at :00, :05, :10, :15, :20, :25, :30, :35, :40, :45, :50, :55 of each hour
    # Full market data refresh happens when 60+ minutes have passed since last market verification
    - cron: '*/5 * * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Run on push to main
  push:
    branches: [ main ]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing to repository
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history to ensure we can push
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests numpy
      
      - name: Check if full update needed
        if: github.event_name != 'push'
        id: update_type
        run: |
          MINUTE=$(date +%M)
          HOUR=$(date +%H)
          CURRENT_TIME=$(date +%s)
          
          # Check when markets were last verified (full update timestamp)
          MARKETS_VERIFIED_FILE=".markets_verified_time"
          LAST_UPDATE_FILE=".last_full_update"
          
          IS_FULL_UPDATE=false
          TIME_SINCE_VERIFIED=0
          
          # Check if markets verified time file exists
          if [ -f "$MARKETS_VERIFIED_FILE" ]; then
            # Read the timestamp (format: "YYYY-MM-DD HH:MM:SS")
            VERIFIED_TIMESTAMP=$(cat "$MARKETS_VERIFIED_FILE" | tr -d '\n\r')
            
            # Convert to Unix timestamp using Python (more reliable across systems)
            VERIFIED_UNIX=$(python3 -c "
import sys
from datetime import datetime, timezone
try:
    dt = datetime.strptime('$VERIFIED_TIMESTAMP', '%Y-%m-%d %H:%M:%S')
    dt = dt.replace(tzinfo=timezone.utc)
    print(int(dt.timestamp()))
except:
    print('0')
" 2>/dev/null || echo "0")
            
            if [ "$VERIFIED_UNIX" != "0" ] && [ "$VERIFIED_UNIX" != "" ] && [ "$VERIFIED_UNIX" -gt 0 ]; then
              TIME_SINCE_VERIFIED=$((CURRENT_TIME - VERIFIED_UNIX))
              MINUTES_SINCE=$((TIME_SINCE_VERIFIED / 60))
              
              echo "Last market verification: $VERIFIED_TIMESTAMP"
              echo "Time since last verification: $MINUTES_SINCE minutes ($TIME_SINCE_VERIFIED seconds)"
              
              # If 60 minutes (3600 seconds) have passed, do full update
              if [ "$TIME_SINCE_VERIFIED" -ge 3600 ]; then
                IS_FULL_UPDATE=true
                echo "Full update needed: 60+ minutes since last market verification"
              else
                echo "Price refresh only: Only $MINUTES_SINCE minutes since last verification (need 60+)"
              fi
            else
              echo "Warning: Could not parse markets verified timestamp '$VERIFIED_TIMESTAMP', assuming full update needed"
              IS_FULL_UPDATE=true
            fi
          else
            # No markets verified file exists - this is first run or file missing
            echo "No .markets_verified_time file found - performing full update"
            IS_FULL_UPDATE=true
          fi
          
          if [ "$IS_FULL_UPDATE" = true ]; then
            echo "type=full" >> $GITHUB_OUTPUT
            echo "Full market fetch will be performed (MINUTE=$MINUTE, HOUR=$HOUR)"
            # Update the last full update timestamp (Unix time)
            echo "$CURRENT_TIME" > "$LAST_UPDATE_FILE"
          else
            echo "type=price" >> $GITHUB_OUTPUT
            echo "Price refresh only (MINUTE=$MINUTE)"
          fi
      
      - name: Full market fetch (when 60+ minutes since last verification)
        if: steps.update_type.outputs.type == 'full' && github.event_name != 'push'
        run: |
          echo "Fetching all markets..."
          python fetch_polymarket.py
          python cluster_markets.py
      
      - name: Price refresh (every 5 minutes)
        if: steps.update_type.outputs.type == 'price' && github.event_name != 'push'
        run: |
          echo "Refreshing prices..."
          # Check if manifest exists, if not do a full update instead
          if [ ! -f "conflict_manifest.json" ]; then
            echo "⚠ WARNING: conflict_manifest.json not found, doing full update instead..."
            python fetch_polymarket.py
            python cluster_markets.py
          else
            python refresh_prices.py
          fi
      
      - name: Verify HTML update
        if: github.event_name != 'push'
        run: |
          echo "=== Verifying HTML Update ==="
          
          # Check if HTML file exists
          if [ ! -f "market_report.html" ]; then
            echo "⚠ WARNING: market_report.html not found!"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "  (This is expected for push-triggered runs if no data was processed)"
              exit 0
            else
              exit 1
            fi
          fi
          
          # Check file size (should be > 0)
          HTML_SIZE=$(stat -f%z market_report.html 2>/dev/null || stat -c%s market_report.html 2>/dev/null || echo "0")
          if [ "$HTML_SIZE" -eq 0 ]; then
            echo "⚠ WARNING: market_report.html is empty!"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "  (This is expected for push-triggered runs if no data was processed)"
              exit 0
            else
              exit 1
            fi
          fi
          echo "✓ HTML file size: $HTML_SIZE bytes"
          
          # Check if HTML contains expected content
          if ! grep -q "Global Conflict Map" market_report.html; then
            echo "❌ ERROR: HTML missing expected title!"
            exit 1
          fi
          echo "✓ HTML contains expected title"
          
          # Check if HTML contains market data
          if ! grep -q "linesData" market_report.html; then
            echo "❌ ERROR: HTML missing market data (linesData)!"
            exit 1
          fi
          echo "✓ HTML contains market data"
          
          # Check if HTML contains Leaflet map
          if ! grep -q "leaflet" market_report.html; then
            echo "❌ ERROR: HTML missing Leaflet map library!"
            exit 1
          fi
          echo "✓ HTML contains Leaflet map"
          
          # Get file modification time
          HTML_MTIME=$(stat -f%m market_report.html 2>/dev/null || stat -c%Y market_report.html 2>/dev/null || echo "0")
          HTML_DATE=$(date -r "$HTML_MTIME" 2>/dev/null || date -d "@$HTML_MTIME" 2>/dev/null || echo "Unknown")
          echo "✓ HTML last modified: $HTML_DATE"
          
          # Check manifest file
          if [ -f "conflict_manifest.json" ]; then
            MANIFEST_SIZE=$(stat -f%z conflict_manifest.json 2>/dev/null || stat -c%s conflict_manifest.json 2>/dev/null || echo "0")
            echo "✓ Manifest file size: $MANIFEST_SIZE bytes"
            
            # Count markets in manifest
            MARKET_COUNT=$(python3 -c "import json; f=open('conflict_manifest.json'); data=json.load(f); print(len(data))" 2>/dev/null || echo "0")
            echo "✓ Markets in manifest: $MARKET_COUNT"
          else
            echo "⚠ WARNING: conflict_manifest.json not found"
          fi
          
          
          echo "=== HTML Verification Complete ==="
      
      - name: Commit changes
        if: github.event_name != 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Create/update a timestamp file to ensure we always have something to commit
          # This tracks when the workflow ran, even if data didn't change
          # Use UTC for consistency (GitHub Actions runs in UTC by default)
          UPDATE_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S')
          echo "$UPDATE_TIMESTAMP" > .last_update_timestamp
          
          # Stage all files that might have changed
          git add market_report.html conflict_manifest.json .last_update_timestamp
          # Also commit the last full update timestamp file if it exists
          if [ -f ".last_full_update" ]; then
            git add .last_full_update
          fi
          # Commit markets verified timestamp file if it exists
          if [ -f ".markets_verified_time" ]; then
            git add .markets_verified_time
          fi
          
          # Ensure timestamp file is always staged (it should always change)
          git add -f .last_update_timestamp
          
          # Check if there are any staged changes
          if git diff --cached --quiet; then
            echo "⚠ WARNING: No changes detected after staging files"
            echo "This might indicate the workflow ran but data didn't change"
            # Still try to commit the timestamp (it should always be different)
            git commit --allow-empty -m "Auto-update: $UPDATE_TIMESTAMP (workflow ran)"
          else
            echo "Changes detected, committing..."
            git commit -m "Auto-update: $UPDATE_TIMESTAMP"
          fi
          echo "✓ Commit completed"
      
      - name: Push changes
        if: github.event_name != 'push'
        run: |
          # Check if there are commits to push
          if git log origin/main..HEAD --oneline | grep -q .; then
            echo "Pushing commits to main branch..."
            git push origin main
            echo "✓ Changes pushed successfully"
          else
            echo "No new commits to push (workflow may have run but no changes detected)"
          fi
      
      - name: Skip processing for push events
        if: github.event_name == 'push'
        run: |
          echo "✓ Workflow triggered by push event"
          echo "✓ Data processing skipped (push events only update workflow files)"
          echo "✓ Scheduled runs will process data and commit changes automatically"
          echo "✓ Workflow completed successfully"
      
      - name: Workflow complete
        if: github.event_name != 'push'
        run: |
          echo "✓ Workflow completed successfully"
          echo "✓ Changes have been committed and pushed"
